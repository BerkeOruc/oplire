[package]
name = "oplire-reset"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "Anthropic Messages bridge with optional Cloudflare WARP controls"
authors = ["Berke Oruc"]
license = "MIT"
repository = "https://github.com/berkeoruc/oplire"

[[bin]]
name = "oplire"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
colored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["net", "process", "rt-multi-thread", "sync", "time"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "blocking"] }
futures-util = "0.3"
bytes = "1"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
